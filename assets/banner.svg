<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Rao Muhammad Mueez - Data and AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#161b22"/>
      <stop offset="1" stop-color="#1c2230"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" opacity="0.7"/>
    </pattern>

    <clipPath id="c0"><rect x="64" y="180" width="0" height="34"><animate attributeName="width" dur="15s" repeatCount="indefinite" keyTimes="0;0.08;0.17;0.2;1" values="0;168;168;0;0"/></rect></clipPath>
    <clipPath id="c1"><rect x="64" y="180" width="480" height="34"><animate attributeName="width" dur="15s" repeatCount="indefinite" keyTimes="0;0.2;0.28;0.37;0.4;1" values="0;0;480;480;0;0"/></rect></clipPath>
    <clipPath id="c2"><rect x="64" y="180" width="0" height="34"><animate attributeName="width" dur="15s" repeatCount="indefinite" keyTimes="0;0.4;0.48;0.57;0.6;1" values="0;0;324;324;0;0"/></rect></clipPath>
    <clipPath id="c3"><rect x="64" y="180" width="0" height="34"><animate attributeName="width" dur="15s" repeatCount="indefinite" keyTimes="0;0.6;0.68;0.77;0.8;1" values="0;0;456;456;0;0"/></rect></clipPath>
    <clipPath id="c4"><rect x="64" y="180" width="0" height="34"><animate attributeName="width" dur="15s" repeatCount="indefinite" keyTimes="0;0.8;0.88;0.97;1" values="0;0;456;456;0"/></rect></clipPath>
  </defs>

  <!-- card -->
  <rect width="900" height="260" rx="16" fill="url(#bg)"/>
  <rect width="900" height="260" rx="16" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="899" height="259" rx="16" fill="none" stroke="#30363d"/>

  <!-- anime / nerd touch: big faint kanji for "blue" -->
  <text x="790" y="222" font-size="190" fill="#58a6ff" opacity="0.07" text-anchor="middle" font-family="'Noto Sans JP','Yu Gothic','Hiragino Sans','Meiryo',sans-serif">青</text>

  <!-- terminal window dots + path -->
  <circle cx="40" cy="38" r="6" fill="#ff5f56"/>
  <circle cx="60" cy="38" r="6" fill="#ffbd2e"/>
  <circle cx="80" cy="38" r="6" fill="#27c93f"/>
  <text x="104" y="43" font-size="13" fill="#6e7681" font-family="'Fira Code','Consolas','Menlo',monospace">~/blue-sniffer</text>

  <!-- name + role -->
  <text x="40" y="106" font-size="44" font-weight="700" fill="#e6edf3" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Rao Muhammad Mueez</text>
  <text x="40" y="136" font-size="16" fill="#8b949e" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Data &amp; AI Engineer  ·  Python  ·  Automation  ·  Full-Stack</text>
  <rect x="40" y="152" width="120" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- terminal prompt -->
  <text x="40" y="204" font-size="20" fill="#3fb950" font-family="'Fira Code','Consolas','Menlo',monospace">&gt;</text>

  <!-- typed line 0 -->
  <g opacity="0">
    <animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;1" values="1;0;0"/>
    <text x="64" y="204" font-size="20" fill="#c9d1d9" font-family="'Fira Code','Consolas','Menlo',monospace" textLength="168" lengthAdjust="spacing" clip-path="url(#c0)">Hey, I'm Mueez</text>
    <rect x="66" y="184" width="10" height="24" fill="#58a6ff"><animate attributeName="x" dur="15s" repeatCount="indefinite" keyTimes="0;0.08;0.17;0.2;1" values="66;234;234;66;66"/></rect>
  </g>

  <!-- typed line 1 -->
  <g opacity="1">
    <animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.4;1" values="0;1;0;0"/>
    <text x="64" y="204" font-size="20" fill="#c9d1d9" font-family="'Fira Code','Consolas','Menlo',monospace" textLength="480" lengthAdjust="spacing" clip-path="url(#c1)">Building data &amp; AI solutions with Python</text>
    <rect x="546" y="184" width="10" height="24" fill="#58a6ff"><animate attributeName="x" dur="15s" repeatCount="indefinite" keyTimes="0;0.2;0.28;0.37;0.4;1" values="66;66;546;546;66;66"/></rect>
  </g>

  <!-- typed line 2 -->
  <g opacity="0">
    <animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4;0.6;1" values="0;1;0;0"/>
    <text x="64" y="204" font-size="20" fill="#c9d1d9" font-family="'Fira Code','Consolas','Menlo',monospace" textLength="324" lengthAdjust="spacing" clip-path="url(#c2)">Automating the boring stuff</text>
    <rect x="66" y="184" width="10" height="24" fill="#58a6ff"><animate attributeName="x" dur="15s" repeatCount="indefinite" keyTimes="0;0.4;0.48;0.57;0.6;1" values="66;66;390;390;66;66"/></rect>
  </g>

  <!-- typed line 3 -->
  <g opacity="0">
    <animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6;0.8;1" values="0;1;0;0"/>
    <text x="64" y="204" font-size="20" fill="#c9d1d9" font-family="'Fira Code','Consolas','Menlo',monospace" textLength="456" lengthAdjust="spacing" clip-path="url(#c3)">Shipping full-stack apps in TypeScript</text>
    <rect x="66" y="184" width="10" height="24" fill="#58a6ff"><animate attributeName="x" dur="15s" repeatCount="indefinite" keyTimes="0;0.6;0.68;0.77;0.8;1" values="66;66;522;522;66;66"/></rect>
  </g>

  <!-- typed line 4 -->
  <g opacity="0">
    <animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.8;1" values="0;1;1"/>
    <text x="64" y="204" font-size="20" fill="#c9d1d9" font-family="'Fira Code','Consolas','Menlo',monospace" textLength="456" lengthAdjust="spacing" clip-path="url(#c4)">Epitech MSc International | Promo 2027</text>
    <rect x="66" y="184" width="10" height="24" fill="#58a6ff"><animate attributeName="x" dur="15s" repeatCount="indefinite" keyTimes="0;0.8;0.88;0.97;1" values="66;66;522;522;66"/></rect>
  </g>
</svg>
