  <text x="253.0" y="104" font-size="13" font-weight="600" fill="#79c0ff" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">JavaScript</text>
  <rect x="308" y="84" width="53" height="30" rx="15" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-opacity="0.35"/>
