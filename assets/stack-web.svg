<svg xmlns="http://www.w3.org/2000/svg" width="440" height="176" viewBox="0 0 440 176" role="img" aria-label="Web &amp; Backend: HTML5, CSS3, React.js, Vue.js, Django REST, Flask, Node.js, Elixir Phoenix">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#1c2230"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.25"/>
    </linearGradient>
    <clipPath id="shape"><rect width="440" height="176" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#shape)">
    <rect width="440" height="176" fill="url(#bg)"/>
    <rect width="440" height="4" fill="url(#bar)"/>
  </g>
  <rect x="0.5" y="0.5" width="439" height="175" rx="14" fill="none" stroke="#30363d"/>

