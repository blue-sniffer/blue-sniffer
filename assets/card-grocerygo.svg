<svg xmlns="http://www.w3.org/2000/svg" width="440" height="160" viewBox="0 0 440 160" role="img" aria-label="GroceryGo-Application repository card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#1c2230"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <clipPath id="shape"><rect width="440" height="160" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#shape)">
    <rect width="440" height="160" fill="url(#bg)"/>
    <rect width="440" height="4" fill="url(#accent)"/>
    <text x="418" y="118" font-size="96" font-weight="700" fill="#58a6ff" opacity="0.06" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">02</text>
  </g>
  <rect x="0.5" y="0.5" width="439" height="159" rx="14" fill="none" stroke="#30363d"/>

  <!-- folder icon -->
  <g transform="translate(24 28)" fill="none" stroke="#8b949e" stroke-width="1.6" stroke-linejoin="round">
    <path d="M1 4a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2z"/>
  </g>

  <text x="52" y="43" font-size="20" font-weight="700" fill="#58a6ff" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">GroceryGo-Application</text>

  <!-- Public pill -->
  <rect x="362" y="26" width="52" height="20" rx="10" fill="none" stroke="#30363d"/>
  <text x="388" y="40" font-size="11" fill="#8b949e" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Public</text>

  <text x="24" y="80" font-size="14" fill="#c9d1d9" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Grocery shopping application</text>
  <text x="24" y="100" font-size="14" fill="#c9d1d9" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">built with TypeScript.</text>

  <line x1="24" y1="116" x2="416" y2="116" stroke="#30363d"/>

  <circle cx="31" cy="136" r="6" fill="#3178c6"/>
  <text x="44" y="141" font-size="13" fill="#8b949e" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">TypeScript</text>
  <text x="416" y="141" font-size="13" font-weight="600" fill="#58a6ff" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">View repository  &#8594;</text>
</svg>
